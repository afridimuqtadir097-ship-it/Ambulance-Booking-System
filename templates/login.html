{% extends "auth_base.html" %}
{% block title %}Log In — MedRush{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="container">
    <div class="card auth-card shadow-sm">
      <div class="text-center mb-4">
        <a href="{{ url_for('index') }}" class="text-decoration-none">
          <span class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></span>
        </a>
        <h3 class="mt-2 mb-1">Welcome back</h3>
        <p class="text-muted small mb-0">Log in to continue to MedRush</p>
      </div>
      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-brand w-100 py-2 mt-2">Log In</button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-brand fw-semibold text-decoration-none">Sign up</a>
      </p>
      <div class="mt-4 pt-3 border-top">
        <p class="text-muted small mb-1"><strong>Demo account</strong> (seeded automatically):</p>
        <p class="text-muted small mb-0">patient@ambulanceapp.com / patient123</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
